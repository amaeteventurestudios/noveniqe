# Puts Onyx accounts (Novenique Core in code; repo amaeteventurestudios/onyx, core/) on the shared server whenever onyx's
# main changes (checked every 30 minutes; "Run workflow" deploys straight away), after its tests pass against PocketBase and Palasora's real database schema (core/deploy/install.sh).
# Uses the same three secrets as the server safety deploy: SERVER_HOST, SERVER_USER, SERVER_SSH_KEY.
# Optional secrets, each turns a sign-in method on (Core works with neither: players stay guests until one is set):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET   "Continue with Google"
#   SMTP_PASS                                6-digit email codes from our own mailbox (no-reply@agentgrandprix.com on the web
#                                            hosting; host, port and user below are not secrets, SMTP_HOST/PORT/USER secrets override)
#   RESEND_API_KEY (or BREVO_API_KEY)        email codes through Resend or Brevo instead; MAIL_FROM optional
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET the pass in every game (without them Core uses Agent Grand Prix's, already on the server)
name: Accounts service (deploy)
on:
  schedule: [{ cron: '11,41 * * * *' }]   # the code lives in amaeteventurestudios/onyx: deploy when its main changed
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/core-deploy.yml']
concurrency: server-core
jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs: { go: '${{ steps.done.outputs.go }}' }
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { repository: amaeteventurestudios/onyx, ref: main }
      - name: Connect
        env: { HOST: '${{ secrets.SERVER_HOST }}', USER: '${{ secrets.SERVER_USER }}', KEY: '${{ secrets.SERVER_SSH_KEY }}' }
        run: bash ops/ci/ssh-setup.sh
      - name: Anything new in onyx?
        env: { EVENT: '${{ github.event_name }}' }
        run: |
          sha=$(git rev-parse HEAD); now=$($SSH 'cat /opt/novenique/ONYX_CORE_SHA 2>/dev/null' || true)
          echo "SHA=$sha" >> "$GITHUB_ENV"
          if [ "$now" = "$sha" ] && [ "$EVENT" = schedule ]; then echo "the accounts service from onyx $sha is already on the server."; echo 'GO=0' >> "$GITHUB_ENV"
          else echo "Deploying the accounts service from onyx $sha (on the server: ${now:-not recorded yet})"; echo 'GO=1' >> "$GITHUB_ENV"; fi
      - uses: actions/checkout@v4
        if: env.GO == '1'
        with: { repository: amaeteventurestudios/palasora, path: palasora, sparse-checkout: services/pocketbase/pb_migrations }
      - uses: actions/setup-node@v4
        if: env.GO == '1'
        with: { node-version: '22' }
      - name: PocketBase for the tests
        if: env.GO == '1'
        run: |
          curl -fsSL -o pb.zip https://github.com/pocketbase/pocketbase/releases/download/v0.40.5/pocketbase_0.40.5_linux_amd64.zip
          unzip -oq pb.zip pocketbase -d /tmp && chmod +x /tmp/pocketbase
      - name: Test
        if: env.GO == '1'
        working-directory: core
        run: PB_BIN=/tmp/pocketbase PB_MIGRATIONS=$GITHUB_WORKSPACE/palasora/services/pocketbase/pb_migrations npm test
      - name: Install on the server
        if: env.GO == '1'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 's1089.usc1.mysecurecloudhost.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'no-reply@agentgrandprix.com' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          tar czf novenique-core.tgz --exclude='test' -C core .
          install -m 600 /dev/null keys.env
          [ -n "$SMTP_PASS" ] || unset SMTP_HOST SMTP_PORT SMTP_USER
          for k in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET RESEND_API_KEY BREVO_API_KEY MAIL_FROM SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET; do printf '%s=%s\n' "$k" "$(printenv $k | tr -d '\r\n')" >> keys.env; done
          $SCP novenique-core.tgz "$DEST:/tmp/"
          $SCP keys.env "$DEST:/tmp/novenique-core-keys.env" && rm -f keys.env
          HOST_IP=$($SSH 'curl -fsS -m 10 https://api.ipify.org || hostname -I | cut -d" " -f1')
          $SSH "chmod 600 /tmp/novenique-core-keys.env; HOST_IP=$HOST_IP bash -s" < core/deploy/install.sh | tee -a "$GITHUB_STEP_SUMMARY"
          $SSH "sudo mkdir -p /opt/novenique && echo $SHA | sudo tee /opt/novenique/ONYX_CORE_SHA >/dev/null"
      - name: Answers from outside
        if: env.GO == '1'
        run: |
          set -euo pipefail
          ip=$($SSH 'curl -fsS -m 10 https://api.ipify.org')
          u="https://accounts.${ip//./-}.sslip.io/health"
          for i in $(seq 1 30); do curl -fsS -m 10 "$u" && break; sleep 5; done
          echo; echo "Spare address: $u" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Deployed
        id: done
        if: env.GO == '1'
        run: echo go=1 >> "$GITHUB_OUTPUT"
  # Then the live-site launch check on what was just deployed (never fails the deploy; see preflight.yml).
  preflight:
    needs: deploy
    if: needs.deploy.outputs.go == '1'
    permissions: { id-token: write, contents: read, issues: write }
    uses: ./.github/workflows/preflight.yml
    with:
      app: Onyx accounts
      sites: "accounts.noveniqe.com"
