name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: amaeteventurestudios/agent-grand-prix-, path: agp }
      - uses: actions/checkout@v4
        with: { repository: amaeteventurestudios/palasora, path: palasora, sparse-checkout: services/pocketbase/pb_migrations }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Backup tool
        run: python3 -m unittest discover -s ops/backup -v
      - name: Scripts parse
        run: for f in ops/server/install.sh ops/check/server-check.sh ops/ci/ssh-setup.sh core/deploy/install.sh; do bash -n "$f"; done
      - name: Accounts service (Core), against Palasora's real schema and against the bare fixture
        run: |
          curl -fsSL -o pb.zip https://github.com/pocketbase/pocketbase/releases/download/v0.40.5/pocketbase_0.40.5_linux_amd64.zip
          unzip -oq pb.zip pocketbase -d /tmp && chmod +x /tmp/pocketbase
          cd core
          PB_BIN=/tmp/pocketbase PB_MIGRATIONS=$GITHUB_WORKSPACE/palasora/services/pocketbase/pb_migrations npm test
          PB_BIN=/tmp/pocketbase npm test
      - name: Benchmark runs
        run: node ops/bench/race-bench.mjs agp/js --seconds 2 --races 8
