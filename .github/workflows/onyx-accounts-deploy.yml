# Puts Onyx's OWN accounts site on the shared server: accounts.amaete.com, for everything the studio makes that is not a game
# (the 3D sites, SavvyMe, Isoteh, Prebuild, Remodel, Jisste). Same code as the games' accounts site (core-deploy.yml,
# accounts.noveniqe.com) but its own database, settings and address (core/deploy/onyx-install.sh in amaeteventurestudios/onyx).
# Runs whenever onyx's main changes (checked every 30 minutes; "Run workflow" deploys straight away), after the tests pass.
# Sign-in keys (Google, the mailbox, Stripe) are copied on the server from the games' accounts settings: no secrets of its own.
# Uses the same three secrets as the server safety deploy: SERVER_HOST, SERVER_USER, SERVER_SSH_KEY.
name: Onyx accounts (deploy)
on:
  schedule: [{ cron: '16,46 * * * *' }]   # the code lives in amaeteventurestudios/onyx: deploy when its main changed
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/onyx-accounts-deploy.yml']
concurrency: server-onyx-accounts
jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs: { go: '${{ steps.done.outputs.go }}' }
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { repository: amaeteventurestudios/onyx, ref: main }
      - name: Connect
        env: { HOST: '${{ secrets.SERVER_HOST }}', USER: '${{ secrets.SERVER_USER }}', KEY: '${{ secrets.SERVER_SSH_KEY }}' }
        run: bash ops/ci/ssh-setup.sh
      - name: Anything new in onyx?
        env: { EVENT: '${{ github.event_name }}' }
        run: |
          sha=$(git rev-parse HEAD); now=$($SSH 'cat /opt/onyx/ACCOUNTS_SHA 2>/dev/null' || true)
          echo "SHA=$sha" >> "$GITHUB_ENV"
          if [ "$now" = "$sha" ] && [ "$EVENT" = schedule ]; then echo "Onyx accounts from onyx $sha is already on the server."; echo 'GO=0' >> "$GITHUB_ENV"
          else echo "Deploying Onyx accounts from onyx $sha (on the server: ${now:-not recorded yet})"; echo 'GO=1' >> "$GITHUB_ENV"; fi
      - uses: actions/setup-node@v4
        if: env.GO == '1'
        with: { node-version: '22' }
      - name: PocketBase for the tests
        if: env.GO == '1'
        run: |
          curl -fsSL -o pb.zip https://github.com/pocketbase/pocketbase/releases/download/v0.40.5/pocketbase_0.40.5_linux_amd64.zip
          unzip -oq pb.zip pocketbase -d /tmp && chmod +x /tmp/pocketbase
      - name: Test
        if: env.GO == '1'
        working-directory: core
        run: PB_BIN=/tmp/pocketbase PB_MIGRATIONS=$GITHUB_WORKSPACE/core/store/pb_migrations npm test
      - name: Install on the server
        if: env.GO == '1'
        run: |
          set -euo pipefail
          tar czf onyx-accounts.tgz --exclude='test' -C core .
          $SCP onyx-accounts.tgz "$DEST:/tmp/"
          HOST_IP=$($SSH 'curl -fsS -m 10 https://api.ipify.org || hostname -I | cut -d" " -f1')
          $SSH "HOST_IP=$HOST_IP bash -s" < core/deploy/onyx-install.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Answers from outside
        if: env.GO == '1'
        run: |
          set -euo pipefail
          ip=$($SSH 'curl -fsS -m 10 https://api.ipify.org')
          u="https://onyx.${ip//./-}.sslip.io/health"
          ok=0
          for i in $(seq 1 30); do if curl -fsS -m 10 "$u"; then ok=1; break; fi; sleep 5; done
          [ "$ok" = 1 ] || { echo "No answer from $u" >&2; exit 1; }
          echo; echo "Spare address: $u" | tee -a "$GITHUB_STEP_SUMMARY"
          # only now mark this version as deployed, so a failed check is retried on the next run
          $SSH "sudo mkdir -p /opt/onyx && echo $SHA | sudo tee /opt/onyx/ACCOUNTS_SHA >/dev/null"
      - name: Deployed
        id: done
        if: env.GO == '1'
        run: echo go=1 >> "$GITHUB_OUTPUT"
  # Then the live-site launch check on what was just deployed (never fails the deploy; see preflight.yml).
  preflight:
    needs: deploy
    if: needs.deploy.outputs.go == '1'
    permissions: { id-token: write, contents: read, issues: write }
    uses: ./.github/workflows/preflight.yml
    with:
      app: Onyx accounts (studio)
      sites: "accounts.amaete.com"
