# Puts Jisste Teams (the team side of Jisste, repo amaeteventurestudios/jisste-teams) on the shared server, using the server
# secrets this repo already has, so the jisste-teams repo needs none. Every 30 minutes it looks at that repo's main branch
# and deploys it when it changed since the last deploy; "Run workflow" deploys straight away. The work itself is the
# jisste-teams repo's server/deploy.sh. Optional variable in this repo (Settings > Secrets and variables > Actions > Variables):
# The jisste-teams repo is private: secret JISSTE_TEAMS_TOKEN is a fine-grained token with read-only Contents on it.
#   JISSTE_TEAMS_DOMAIN   the app's names, main one first (default teams.jisste.noveniqe.com; teams.<ip>.sslip.io is always added)
name: Jisste Teams (deploy)
on:
  schedule: [{ cron: '17,47 * * * *' }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/jisste-teams-deploy.yml']
concurrency: deploy-jisste-teams
jobs:
  deploy:
    runs-on: ubuntu-24.04-arm   # the server is ARM too
    outputs: { go: '${{ steps.done.outputs.go }}' }
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { repository: amaeteventurestudios/jisste-teams, ref: main, token: '${{ secrets.JISSTE_TEAMS_TOKEN || github.token }}' }
      - name: Anything new?
        env: { HOST: '${{ secrets.SERVER_HOST }}', USER: '${{ secrets.SERVER_USER }}', KEY: '${{ secrets.SERVER_SSH_KEY }}', EVENT: '${{ github.event_name }}' }
        run: |
          set -euo pipefail
          if [ ! -f server/deploy.sh ]; then echo '::notice::The jisste-teams repo has no app on main yet (merge its pull request first).'; echo 'GO=0' >> "$GITHUB_ENV"; exit 0; fi
          sha=$(git rev-parse HEAD)
          k="$RUNNER_TEMP/k"; install -m 600 /dev/null "$k"; printf '%s\n' "$KEY" | tr -d '\r' | sed -n '/-----BEGIN/,/-----END/p' > "$k"
          h=$(printf '%s' "$HOST" | grep -oE '[0-9]{1,3}(\.[0-9]{1,3}){3}|[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+' | tail -1)
          u=$(printf '%s' "$USER" | grep -oE '[a-z_][a-z0-9_-]*' | tail -1 || true)
          # what is on the server, and whether Core has made Jisste's sign-in secret since the last deploy picked it up
          now=$(ssh -i "$k" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "${u:-ubuntu}@$h" \
            'cat /opt/jisste-teams/DEPLOYED 2>/dev/null; if sudo test -f /etc/novenique/clients/jisste-teams.env && ! sudo grep -qs "^ONYX_CLIENT_SECRET=." /etc/jisste-teams.env; then echo new-secret; fi' || true); rm -f "$k"
          if [ "$now" = "$sha" ] && [ "$EVENT" = schedule ]; then echo "Jisste Teams $sha is already on the server."; echo 'GO=0' >> "$GITHUB_ENV"
          else echo "Deploying jisste-teams $sha (on the server: ${now:-nothing yet})"; echo 'GO=1' >> "$GITHUB_ENV"; echo "SHA=$sha" >> "$GITHUB_ENV"; fi
      - uses: actions/setup-node@v4
        if: env.GO == '1'
        with: { node-version: 22 }
      - name: Test
        if: env.GO == '1'
        run: cd api && npm ci --no-audit --no-fund && npm test
      - name: Pack, copy to the server and (re)start the services
        if: env.GO == '1'
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          KEY: ${{ secrets.SERVER_SSH_KEY }}
          DOMAIN: ${{ vars.JISSTE_TEAMS_DOMAIN || 'teams.jisste.noveniqe.com' }}
        run: bash server/deploy.sh
      - name: Check the app answers
        if: env.GO == '1'
        run: |
          ok=0
          for n in $SITES; do
            up=0
            for i in $(seq 1 9); do curl -fsS -m 15 -o /dev/null "https://$n/api/health" && { up=1; break; }; sleep 10; done
            if [ "$up" = 1 ]; then echo "OK: https://$n" | tee -a "$GITHUB_STEP_SUMMARY"; ok=1
            else echo "::warning::https://$n doesn't answer yet. For a domain, check its DNS A record points at 129.146.26.28 (in Cloudflare: DNS only, grey cloud)."; fi
          done
          [ "$ok" = 1 ] || echo "::warning::Jisste Teams runs on the server, but no address answers from outside yet. HTTPS certificates can take a minute."
      - name: Deployed
        id: done
        if: env.GO == '1'
        run: echo go=1 >> "$GITHUB_OUTPUT"
  # Then the live-site launch check on what was just deployed (never fails the deploy; see preflight.yml).
  preflight:
    needs: deploy
    if: needs.deploy.outputs.go == '1'
    permissions: { id-token: write, contents: read, issues: write }
    uses: ./.github/workflows/preflight.yml
    with:
      app: Jisste Teams
      sites: "${{ vars.JISSTE_TEAMS_DOMAIN || 'teams.jisste.noveniqe.com' }}"
